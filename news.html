<body>
<main class="page">
  <h1 class="pageTitle">お知らせ</h1>

  <p class="lead">
    田子山富士168の縁プロジェクトからの<br>
    お知らせです。
  </p>

  <div class="statusBox" id="statusBox">お知らせを読み込んでいます。</div>
  <div class="newsList" id="newsList"></div>

  <div class="btnArea">
    <a class="linkBtn blackBtn" id="topLink" href="index.html">トップへ戻る</a>
  </div>

  <footer class="footer">
    田子山富士 168の縁プロジェクト<br>
    お知らせ
  </footer>
</main>

<script>
const SHEET_ID = "15jtF9F4B6W07ZZq2nyxb_tlxujbGMBGvpbULWzfFWAU";
const SHEET_NAME = "お知らせ";
const SHARE_NEWS_PAGE = "https://ichirohns-jpg.github.io/tagoyama-fuji-168/share-news.html";

let currentUserId = "";

window.addEventListener("load", initNews);

function initNews(){
  currentUserId = getUserId();
  updateLinks();
  loadNewsFromSheet();
}

function loadNewsFromSheet(){
  setStatus("お知らせを読み込んでいます。");

  const callbackName =
    "tagoyamaSheetCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 1000000);

  const script = document.createElement("script");
  const query = "select A,B,C,D,E,F,G,H,I,J";

  let timer = setTimeout(function(){
    cleanup();
    setStatus("お知らせを読み込めませんでした。");
  }, 15000);

  window[callbackName] = function(response){
    cleanup();
    handleSheetResponse(response);
  };

  script.onerror = function(){
    cleanup();
    setStatus("お知らせを読み込めませんでした。");
  };

  script.src =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?sheet=" +
    encodeURIComponent(SHEET_NAME) +
    "&tqx=out:json;responseHandler:" +
    encodeURIComponent(callbackName) +
    "&tq=" +
    encodeURIComponent(query) +
    "&v=" +
    Date.now();

  document.head.appendChild(script);

  function cleanup(){
    clearTimeout(timer);

    try{
      delete window[callbackName];
    }catch(error){
      window[callbackName] = undefined;
    }

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }
  }
}

function handleSheetResponse(response){
  if(
    !response ||
    response.status === "error" ||
    !response.table ||
    !Array.isArray(response.table.rows)
  ){
    setStatus("お知らせを読み込めませんでした。");
    return;
  }

  const list = response.table.rows
    .map(function(row,index){
      const cells = row && Array.isArray(row.c) ? row.c : [];
      const imageUrls = [3,4,5,6,7]
        .map(function(column){
          return getSafeUrl(getCell(cells[column]));
        })
        .filter(function(url){
          return url;
        });

      return {
        sourceIndex:index,
        date:getDateCell(cells[0]),
        title:getCell(cells[1]),
        text:getCell(cells[2]),
        imageUrls:imageUrls,
        youtubeUrl:getCell(cells[8]),
        detailUrl:getSafeUrl(getCell(cells[9]))
      };
    })
    .filter(function(item){
      return Boolean(
        item.date ||
        item.title ||
        item.text ||
        item.imageUrls.length ||
        item.youtubeUrl ||
        item.detailUrl
      );
    });

  list.sort(function(a,b){
    const dateDifference = getDateNumber(b.date) - getDateNumber(a.date);

    if(dateDifference !== 0){
      return dateDifference;
    }

    return b.sourceIndex - a.sourceIndex;
  });

  renderNews(list);
}

function renderNews(list){
  const newsList = document.getElementById("newsList");

  if(!newsList){
    return;
  }

  newsList.innerHTML = "";

  if(!Array.isArray(list) || list.length === 0){
    setStatus("現在表示できるお知らせはありません。");
    return;
  }

  list.forEach(function(item,index){
    const box = document.createElement("article");
    box.className = "newsItem";

    item.imageUrls.forEach(function(url){
      const image = document.createElement("img");
      image.className = "newsImage";
      image.src = url;
      image.alt = item.title || "お知らせ画像";
      image.loading = "lazy";
      image.onerror = function(){
        this.remove();
      };
      box.appendChild(image);
    });

    const title = document.createElement("h2");
    title.className = "newsTitle";
    title.textContent = item.title || "お知らせ";
    box.appendChild(title);

    if(item.date){
      const date = document.createElement("p");
      date.className = "newsDate";
      date.textContent = formatDateText(item.date);
      box.appendChild(date);
    }

    if(item.text){
      const text = document.createElement("p");
      text.className = "newsText";
      text.textContent = item.text;
      box.appendChild(text);
    }

    if(item.detailUrl){
      const detail = document.createElement("a");
      detail.className = "detailLink";
      detail.href = item.detailUrl;
      detail.target = "_blank";
      detail.rel = "noopener noreferrer";
      detail.textContent = "詳しく見る";
      box.appendChild(detail);
    }

    const embedUrl = getYouTubeEmbedUrl(item.youtubeUrl);

    if(embedUrl){
      box.appendChild(createYouTubeBlock(embedUrl));
    }

    box.appendChild(createShareButtons(item,index));
    newsList.appendChild(box);
  });

  setStatus("新しいお知らせから順番に表示しています。");
}

function createYouTubeBlock(embedUrl){
  const box = document.createElement("div");
  box.className = "youtubeBox";

  const wrap = document.createElement("div");
  wrap.className = "youtubeFrameWrap";

  const iframe = document.createElement("iframe");
  iframe.className = "youtubeFrame";
  iframe.src = embedUrl;
  iframe.title = "YouTube動画";
  iframe.loading = "lazy";
  iframe.allow =
    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.allowFullscreen = true;

  wrap.appendChild(iframe);
  box.appendChild(wrap);
  return box;
}

function createShareButtons(item,index){
  const area = document.createElement("div");
  area.className = "shareBtnArea";

  const facebook = document.createElement("button");
  facebook.type = "button";
  facebook.className = "smallBtn blueBtn";
  facebook.textContent = "Facebookに投稿";
  facebook.addEventListener("click", function(){
    postFacebookNews(item,index);
  });

  const line = document.createElement("button");
  line.type = "button";
  line.className = "smallBtn greenBtn";
  line.textContent = "LINEで送る";
  line.addEventListener("click", function(){
    sendLineNews(item,index);
  });

  const x = document.createElement("button");
  x.type = "button";
  x.className = "smallBtn blackBtn";
  x.textContent = "Xで投稿";
  x.addEventListener("click", function(){
    postXNews(item,index);
  });

  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "smallBtn blueBtn";
  copy.textContent = "リンクをコピー";
  copy.addEventListener("click", function(){
    copyNews(item,index);
  });

  area.appendChild(facebook);
  area.appendChild(line);
  area.appendChild(x);
  area.appendChild(copy);
  return area;
}

function getYouTubeEmbedUrl(value){
  const text = getString(value);

  if(!text){
    return "";
  }

  let url;

  try{
    url = new URL(text);
  }catch(error){
    return "";
  }

  const host = url.hostname.toLowerCase().replace(/^www\./,"");
  let videoId = "";

  if(host === "youtu.be"){
    videoId = url.pathname.split("/").filter(Boolean)[0] || "";
  }else if(host === "youtube.com" || host === "m.youtube.com"){
    if(url.pathname === "/watch"){
      videoId = url.searchParams.get("v") || "";
    }else if(url.pathname.indexOf("/shorts/") === 0){
      videoId = url.pathname.split("/shorts/")[1].split("/")[0];
    }else if(url.pathname.indexOf("/embed/") === 0){
      videoId = url.pathname.split("/embed/")[1].split("/")[0];
    }else if(url.pathname.indexOf("/live/") === 0){
      videoId = url.pathname.split("/live/")[1].split("/")[0];
    }
  }

  videoId = videoId.replace(/[^A-Za-z0-9_-]/g,"");

  if(!videoId){
    return "";
  }

  return "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId) +
    "?rel=0";
}

function getCell(cell){
  if(!cell){
    return "";
  }

  if(cell.v !== null && cell.v !== undefined && String(cell.v).trim() !== ""){
    return getString(cell.v);
  }

  return getString(cell.f);
}

function getDateCell(cell){
  if(!cell){
    return "";
  }

  return getString(cell.f || cell.v);
}

function getSafeUrl(value){
  const text = getString(value);

  if(!text){
    return "";
  }

  try{
    const url = new URL(text, location.href);

    if(url.protocol !== "https:" && url.protocol !== "http:"){
      return "";
    }

    return url.href;
  }catch(error){
    return "";
  }
}

function makeNewsShareText(item){
  let text =
    "田子山富士168の縁プロジェクト お知らせ\n" +
    (item.title || "お知らせ") + "\n" +
    (item.text || "");

  if(item.youtubeUrl){
    text += "\n\n動画はこちら\n" + item.youtubeUrl;
  }

  return text;
}

function buildNewsShareUrl(index){
  return SHARE_NEWS_PAGE + "?n=" + encodeURIComponent(String(index)) + "&v=20260902-4";
}

async function postFacebookNews(item,index){
  const shareUrl = buildNewsShareUrl(index);
  await copyText(makeNewsShareText(item));

  alert("投稿文をコピーしました。\nFacebook投稿画面で本文欄に貼り付けてください。");

  window.open(
    "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(shareUrl),
    "_blank",
    "noopener,noreferrer"
  );
}

function sendLineNews(item,index){
  const shareUrl = buildNewsShareUrl(index);
  const lineText =
    "田子山富士168の縁プロジェクト お知らせ\n" +
    (item.title || "お知らせ") +
    "\n\n" +
    shareUrl;

  location.href =
    "https://line.me/R/msg/text/?" +
    encodeURIComponent(lineText);
}

function postXNews(item,index){
  const shareUrl = buildNewsShareUrl(index);
  const url =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(makeNewsShareText(item)) +
    "&url=" +
    encodeURIComponent(shareUrl);

  window.open(url,"_blank","noopener,noreferrer");
}

async function copyNews(item,index){
  await copyText(buildNewsShareUrl(index));
  alert("お知らせの短いリンクをコピーしました。");
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(error){
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.focus();
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}

function getUserId(){
  const params = new URLSearchParams(location.search);
  const value =
    getString(params.get("userId")) ||
    getString(params.get("userid")) ||
    getString(params.get("uid")) ||
    getString(localStorage.getItem("tagoyamaUserId")) ||
    getString(localStorage.getItem("tagoyamaFujiUserId"));

  if(value){
    localStorage.setItem("tagoyamaUserId",value);
    localStorage.setItem("tagoyamaFujiUserId",value);
  }

  return value;
}

function updateLinks(){
  const topLink = document.getElementById("topLink");

  if(!topLink){
    return;
  }

  const query = currentUserId
    ? "?userId=" + encodeURIComponent(currentUserId)
    : "";

  topLink.href = "index.html" + query;
}

function setStatus(text){
  const status = document.getElementById("statusBox");

  if(status){
    status.textContent = text;
  }
}

function getDateNumber(value){
  const text = toHalfWidthNumber(getString(value));
  const full = text.match(/([0-9]{4})[^0-9]?([0-9]{1,2})[^0-9]?([0-9]{1,2})/);

  if(full){
    return Number(
      full[1] +
      String(full[2]).padStart(2,"0") +
      String(full[3]).padStart(2,"0")
    );
  }

  const short = text.match(/([0-9]{1,2})[^0-9]?([0-9]{1,2})/);

  if(short){
    return Number(
      new Date().getFullYear() +
      String(short[1]).padStart(2,"0") +
      String(short[2]).padStart(2,"0")
    );
  }

  return 0;
}

function formatDateText(value){
  return toHalfWidthNumber(getString(value))
    .replace(/-/g,"/")
    .replace(/\./g,"/")
    .replace(/\s.*$/,"");
}

function toHalfWidthNumber(value){
  return getString(value).replace(/[０-９]/g,function(character){
    return String.fromCharCode(character.charCodeAt(0) - 0xFEE0);
  });
}

function getString(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value).trim();
}
</script>
