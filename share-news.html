<style>

<body>
<main class="page">
  <header class="hero">
    <div class="logoFrame">
      <img src="logo.png" alt="田子山富士168の縁プロジェクト">
    </div>
    <h1 class="mainTitle">田子山富士</h1>
    <p class="mainSubTitle">168の縁プロジェクト<br>シェアされたお知らせ</p>
  </header>

  <div class="statusBox" id="statusBox">お知らせを読み込んでいます。</div>

  <section class="card" id="articleCard">
    <div id="imageArea"></div>
    <h2 class="newsTitle" id="newsTitle">田子山富士からのお知らせ</h2>
    <p class="newsDate" id="newsDate"></p>
    <p class="newsText" id="newsText" style="display:none"></p>
    <p class="emptyText" id="emptyText" style="display:none">お知らせの内容を表示できませんでした。</p>
    <div id="youtubeArea"></div>
    <div id="detailArea"></div>
  </section>

  <div class="buttonArea">
    <a class="linkBtn blueBtn" id="newsLink" href="news.html">お知らせ一覧へ</a>
    <a class="linkBtn blackBtn" id="topLink" href="index.html">トップへ戻る</a>
  </div>

  <footer class="footer">
    田子山富士 168の縁プロジェクト<br>
    シェア記事
  </footer>
</main>

<script>
const SHEET_ID = "15jtF9F4B6W07ZZq2nyxb_tlxujbGMBGvpbULWzfFWAU";
const SHEET_NAME = "お知らせ";
const DEFAULT_TITLE = "田子山富士からのお知らせ";
const DEFAULT_DESCRIPTION = "田子山富士168の縁プロジェクトからのお知らせです。";
const DEFAULT_IMAGE = "https://ichirohns-jpg.github.io/tagoyama-fuji-168/ogp-news.jpg";
const PAGE_URL = "https://ichirohns-jpg.github.io/tagoyama-fuji-168/share-news.html";

window.addEventListener("load", initShareNews);

function initShareNews(){
  const params = new URLSearchParams(location.search);
  const index = getArticleIndex(params);
  const userId =
    getString(params.get("userId")) ||
    getString(params.get("userid")) ||
    getString(params.get("uid")) ||
    getString(localStorage.getItem("tagoyamaUserId")) ||
    getString(localStorage.getItem("tagoyamaFujiUserId"));

  updateLinks(userId);
  loadArticle(index);
}

function getArticleIndex(params){
  const value =
    params.get("n") ||
    params.get("index") ||
    params.get("article") ||
    "0";

  const number = Number.parseInt(value,10);

  if(!Number.isFinite(number) || number < 0){
    return 0;
  }

  return number;
}

function loadArticle(index){
  setStatus("お知らせを読み込んでいます。");

  const callbackName =
    "tagoyamaShareSheetCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 1000000);

  const query = "select A,B,C,D,E,F,G,H,I,J";
  const script = document.createElement("script");
  let finished = false;

  window[callbackName] = function(response){
    finish();

    if(
      !response ||
      response.status === "error" ||
      !response.table ||
      !Array.isArray(response.table.rows)
    ){
      showError("お知らせを表示できませんでした。");
      return;
    }

    const list = response.table.rows
      .map(function(row,indexNumber){
        return normalizeSheetRow(row,indexNumber);
      })
      .filter(function(item){
        return Boolean(
          item.date ||
          item.title ||
          item.text ||
          item.imageUrls.length ||
          item.youtubeUrl ||
          item.detailUrl
        );
      });

    list.sort(function(a,b){
      const dateDifference =
        getDateNumber(b.date) - getDateNumber(a.date);

      if(dateDifference !== 0){
        return dateDifference;
      }

      return b.sourceIndex - a.sourceIndex;
    });

    const item = list[index] || list[0] || null;

    if(!item){
      showError("表示できるお知らせがありません。");
      return;
    }

    renderArticle(item,index);
    setStatus("お知らせを表示しました。");
  };

  script.onerror = function(){
    finish();
    showError("お知らせを表示できませんでした。");
  };

  script.src =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?sheet=" +
    encodeURIComponent(SHEET_NAME) +
    "&tqx=out:json;responseHandler:" +
    encodeURIComponent(callbackName) +
    "&tq=" +
    encodeURIComponent(query) +
    "&v=" +
    Date.now();

  document.head.appendChild(script);

  window.setTimeout(function(){
    if(!finished){
      finish();
      showError("お知らせを読み込めませんでした。");
    }
  },15000);

  function finish(){
    if(finished){
      return;
    }

    finished = true;

    try{
      delete window[callbackName];
    }catch(error){
      window[callbackName] = undefined;
    }

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }
  }
}

function normalizeSheetRow(row,index){
  const cells = row && Array.isArray(row.c) ? row.c : [];
  const imageUrls = [3,4,5,6,7]
    .map(function(column){
      return getSafeUrl(getCell(cells[column]));
    })
    .filter(function(url){
      return url;
    });

  return {
    sourceIndex:index,
    date:getDateCell(cells[0]),
    title:getCell(cells[1]),
    text:getCell(cells[2]),
    imageUrls:imageUrls,
    youtubeUrl:getCell(cells[8]),
    detailUrl:getSafeUrl(getCell(cells[9]))
  };
}

function renderArticle(item,index){
  const imageArea = document.getElementById("imageArea");
  const title = document.getElementById("newsTitle");
  const date = document.getElementById("newsDate");
  const text = document.getElementById("newsText");
  const empty = document.getElementById("emptyText");
  const youtubeArea = document.getElementById("youtubeArea");
  const detailArea = document.getElementById("detailArea");

  if(imageArea){
    imageArea.innerHTML = "";

    item.imageUrls.forEach(function(url){
      const image = document.createElement("img");
      image.className = "newsImage";
      image.src = url;
      image.alt = item.title || DEFAULT_TITLE;
      image.loading = "lazy";
      image.onerror = function(){
        this.remove();
      };
      imageArea.appendChild(image);
    });
  }

  if(title){
    title.textContent = item.title || DEFAULT_TITLE;
  }

  if(date){
    date.textContent = item.date ? formatDateText(item.date) : "";
    date.style.display = item.date ? "block" : "none";
  }

  if(text){
    text.textContent = item.text || "";
    text.style.display = item.text ? "block" : "none";
  }

  if(empty){
    empty.style.display = item.text ? "none" : "block";
  }

  if(youtubeArea){
    youtubeArea.innerHTML = "";

    const embedUrl = getYouTubeEmbedUrl(item.youtubeUrl);

    if(embedUrl){
      youtubeArea.appendChild(createYouTubeBlock(embedUrl));
    }
  }

  if(detailArea){
    detailArea.innerHTML = "";

    if(item.detailUrl){
      const detail = document.createElement("a");
      detail.className = "detailLink";
      detail.href = item.detailUrl;
      detail.target = "_blank";
      detail.rel = "noopener noreferrer";
      detail.textContent = "詳しくはこちら";
      detailArea.appendChild(detail);
    }
  }

  updateArticleMeta(item,index);
}

function createYouTubeBlock(embedUrl){
  const box = document.createElement("div");
  box.className = "youtubeBox";

  const wrap = document.createElement("div");
  wrap.className = "youtubeFrameWrap";

  const iframe = document.createElement("iframe");
  iframe.className = "youtubeFrame";
  iframe.src = embedUrl;
  iframe.title = "YouTube動画";
  iframe.loading = "lazy";
  iframe.allow =
    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.allowFullscreen = true;

  wrap.appendChild(iframe);
  box.appendChild(wrap);
  return box;
}

function getYouTubeEmbedUrl(value){
  const text = getString(value);

  if(!text){
    return "";
  }

  let url;

  try{
    url = new URL(text);
  }catch(error){
    return "";
  }

  const host = url.hostname.toLowerCase().replace(/^www\./,"");
  let videoId = "";

  if(host === "youtu.be"){
    videoId = url.pathname.split("/").filter(Boolean)[0] || "";
  }else if(host === "youtube.com" || host === "m.youtube.com"){
    if(url.pathname === "/watch"){
      videoId = url.searchParams.get("v") || "";
    }else if(url.pathname.indexOf("/shorts/") === 0){
      videoId = url.pathname.split("/shorts/")[1].split("/")[0];
    }else if(url.pathname.indexOf("/embed/") === 0){
      videoId = url.pathname.split("/embed/")[1].split("/")[0];
    }else if(url.pathname.indexOf("/live/") === 0){
      videoId = url.pathname.split("/live/")[1].split("/")[0];
    }
  }

  videoId = videoId.replace(/[^A-Za-z0-9_-]/g,"");

  if(!videoId){
    return "";
  }

  return "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId) +
    "?rel=0";
}

function updateArticleMeta(item,index){
  const title = item.title || DEFAULT_TITLE;
  const description = makeDescription(item.text || DEFAULT_DESCRIPTION);
  const image = item.imageUrls[0] || DEFAULT_IMAGE;
  const url = buildArticleUrl(index);

  document.title = title;

  setMeta("name","description",description);
  setMeta("property","og:title",title);
  setMeta("property","og:description",description);
  setMeta("property","og:type","article");
  setMeta("property","og:url",url);
  setMeta("property","og:image",image);
  setMeta("property","og:image:secure_url",image);
  setMeta("property","og:image:alt",title);
  setMeta("name","twitter:title",title);
  setMeta("name","twitter:description",description);
  setMeta("name","twitter:image",image);

  const canonical = document.querySelector('link[rel="canonical"]');

  if(canonical){
    canonical.href = url;
  }
}

function setMeta(attribute,name,value){
  const selector =
    "meta[" + attribute + "=\"" + name.replace(/\"/g,"\\\"") + "\"]";
  const element = document.querySelector(selector);

  if(element){
    element.setAttribute("content",value);
  }
}

function buildArticleUrl(index){
  const params = new URLSearchParams(location.search);
  const userId =
    getString(params.get("userId")) ||
    getString(params.get("userid")) ||
    getString(params.get("uid"));
  const query = new URLSearchParams();

  query.set("n",String(index));

  if(userId){
    query.set("userId",userId);
  }

  return PAGE_URL + "?" + query.toString();
}

function updateLinks(userId){
  const query = userId
    ? "?userId=" + encodeURIComponent(userId)
    : "";
  const newsLink = document.getElementById("newsLink");
  const topLink = document.getElementById("topLink");

  if(newsLink){
    newsLink.href = "news.html" + query;
  }

  if(topLink){
    topLink.href = "index.html" + query;
  }
}

function showError(message){
  setStatus(message);

  const empty = document.getElementById("emptyText");

  if(empty){
    empty.style.display = "block";
  }
}

function setStatus(message){
  const status = document.getElementById("statusBox");

  if(status){
    status.textContent = message;
  }
}

function getCell(cell){
  if(!cell){
    return "";
  }

  if(cell.v !== null && cell.v !== undefined && String(cell.v).trim() !== ""){
    return getString(cell.v);
  }

  return getString(cell.f);
}

function getDateCell(cell){
  if(!cell){
    return "";
  }

  return getString(cell.f || cell.v);
}

function getSafeUrl(value){
  const text = getString(value);

  if(!text){
    return "";
  }

  try{
    const url = new URL(text,location.href);

    if(url.protocol !== "https:" && url.protocol !== "http:"){
      return "";
    }

    return url.href;
  }catch(error){
    return "";
  }
}

function getDateNumber(value){
  const text = toHalfWidthNumber(getString(value));
  const full = text.match(/([0-9]{4})[^0-9]?([0-9]{1,2})[^0-9]?([0-9]{1,2})/);

  if(full){
    return Number(
      full[1] +
      String(full[2]).padStart(2,"0") +
      String(full[3]).padStart(2,"0")
    );
  }

  const short = text.match(/([0-9]{1,2})[^0-9]?([0-9]{1,2})/);

  if(short){
    return Number(
      new Date().getFullYear() +
      String(short[1]).padStart(2,"0") +
      String(short[2]).padStart(2,"0")
    );
  }

  return 0;
}

function formatDateText(value){
  return toHalfWidthNumber(getString(value))
    .replace(/-/g,"/")
    .replace(/\./g,"/")
    .replace(/\s.*$/g,"");
}

function makeDescription(value){
  const text = getString(value).replace(/\s+/g," ");

  if(!text){
    return DEFAULT_DESCRIPTION;
  }

  return text.length > 150 ? text.slice(0,147) + "…" : text;
}

function toHalfWidthNumber(value){
  return getString(value).replace(/[０-９]/g,function(character){
    return String.fromCharCode(character.charCodeAt(0) - 0xFEE0);
  });
}

function getString(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value).trim();
}
</script>
</body>
